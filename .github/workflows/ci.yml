name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Skylane.slnx

      - name: Build
        run: dotnet build Skylane.slnx --no-restore --configuration Release

      # Os testes de integração usam Testcontainers: o runner do GitHub já tem Docker.
      # O logger GitHubActions mostra os testes que falham como anotações no commit.
      - name: Test
        run: >-
          dotnet test Skylane.slnx --no-build --configuration Release
          --logger "console;verbosity=normal"
          --logger "GitHubActions;summary-include-passed=false"

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/Skylane.Web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Skylane.Web/package-lock.json

      - name: Install
        run: npm ci

      # tsc -b verifica os tipos de todo o projeto antes do vite build.
      - name: Type check and build
        run: npm run build

  # Constrói a imagem Docker e, nos pushes para main, publica-a no GitHub Container Registry
  # (ghcr.io). É essa imagem que corre na demo publicada no Azure Container Apps.
  docker:
    runs-on: ubuntu-latest
    needs: [build-and-test, web]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/samrodrigues015/skylane:latest
            ghcr.io/samrodrigues015/skylane:${{ github.sha }}

  # Atualiza a demo no Azure com a imagem acabada de publicar.
  # Usa OIDC: o GitHub prova ao Azure que é este repositório (branch main) e recebe um token
  # temporário, sem nenhuma password guardada no GitHub. Só corre depois de configurar
  # as variáveis AZURE_CLIENT_ID, AZURE_TENANT_ID e AZURE_SUBSCRIPTION_ID no repositório.
  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image to Azure Container Apps
        run: >-
          az containerapp update
          --name skylane
          --resource-group skylane-rg
          --image ghcr.io/samrodrigues015/skylane:${{ github.sha }}
