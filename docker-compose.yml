services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev_Passw0rd!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Opcional: "docker compose up" arranca tudo; para desenvolver no Visual Studio,
  # basta "docker compose up sqlserver" e correr a API localmente.
  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=Bilheteira;User Id=sa;Password=Dev_Passw0rd!;TrustServerCertificate=True"
    ports:
      - "8080:8080"
    restart: on-failure
